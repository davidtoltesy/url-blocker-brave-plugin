<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>URL Blokkolás</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 250px;
      margin: 0;
      padding: 10px;
    }
    label, input, button, ul {
      display: block;
      margin: 5px 0;
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    button {
      padding: 5px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }

    /* Remove button styling */
    .remove-button {
        background-color: transparent;
        color: #e74c3c;  /* Modern piros szín */
        border: none;
        font-size: 18px;
        cursor: pointer;
        transition: color 0.3s, transform 0.2s;  /* Animációk */
    }

    .remove-button:hover {
        color: #c0392b;  /* Sötétebb piros a hover hatásra */
        transform: scale(1.1);  /* Finom méretnövekedés */
    }

    /* Fókuszálás esetén */
    .remove-button:focus {
        outline: none;
    }

    /* Korábbi gombok stílusának eltávolítása */
    /* .remove-button {
        background-color: red;
        color: white;
        border: none;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        font-size: 14px;
        cursor: pointer;
        margin-left: 10px;
    }
    .remove-button:hover {
        background-color: darkred;
    } */
</style>

</head>
<body>
    <h3>Blokkolási Időintervallum</h3>
    
    <label for="startHour">Kezdő Óra:</label>
    <input type="number" id="startHour" min="0" max="23" placeholder="Óra (0-23)">
    
    <label for="startMinute">Kezdő Perc:</label>
    <input type="number" id="startMinute" min="0" max="59" placeholder="Perc (0-59)">
    
    <label for="endHour">Befejező Óra:</label>
    <input type="number" id="endHour" min="0" max="23" placeholder="Óra (0-23)">
    
    <label for="endMinute">Befejező Perc:</label>
    <input type="number" id="endMinute" min="0" max="59" placeholder="Perc (0-59)">
    
    <label for="url">Új URL:</label>
    <input type="text" id="url" placeholder="Pl. facebook.com">
    
    <button id="add">Hozzáadás</button>
    
    <!-- Lista a blokkolt URL-ekhez -->
    <h3>Blokkolás</h3>
    <ul id="urlList"></ul>
    
    <script src="popup.js"></script>
  </body>
  
  
</html>
