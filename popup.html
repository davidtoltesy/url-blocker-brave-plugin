<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduled URL Blocker & Focus Site Blocker</title>
  <style>
    :root {
      --bg: #0F1216;
      --surface: #161B22;
      --surface-raised: #1C2330;
      --border: #21262D;
      --text: #E6EDF3;
      --text-muted: #8B949E;
      --danger: #F85149;
      --danger-dim: rgba(248, 81, 73, 0.14);
      --ok: #3FB950;
      --focus: #58A6FF;
      --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; }

    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.45;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .header .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--muted, #384);
      background: var(--dot, var(--text-muted));
      flex: none;
    }

    .header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header .count {
      margin-left: auto;
      color: var(--text-muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 3px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .tab {
      flex: 1;
      padding: 7px 0;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s, color 0.18s;
    }

    .tab:hover { color: var(--text); }
    .tab.active {
      background: var(--surface-raised);
      color: var(--text);
    }

    .tab:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .field { margin-bottom: 14px; }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-muted);
      font-size: 12px;
    }

    input[type="text"] {
      width: 100%;
      padding: 9px 11px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      transition: border-color 0.15s;
    }

    input[type="text"]::placeholder { color: var(--text-muted); }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--focus);
    }

    .field-row { display: flex; align-items: center; gap: 6px; }

    .field-row .sep {
      color: var(--text-muted);
      flex: none;
    }

    select {
      flex: 1;
      padding: 9px 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      font-family: var(--mono);
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238B949E' stroke-width='1.5' fill='none'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 10px center;
      cursor: pointer;
    }

    select:focus {
      outline: none;
      border-color: var(--focus);
    }

    .modes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .mode {
      padding: 9px 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .mode:hover { color: var(--text); }

    .mode.active {
      border-color: var(--danger);
      background: var(--danger-dim);
      color: var(--danger);
    }

    .mode:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    .prime {
      width: 100%;
      padding: 10px 0;
      border: none;
      border-radius: 9px;
      background: var(--danger);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s;
    }

    .prime:hover { filter: brightness(1.12); }
    .prime:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    .preset-row { margin-top: 10px; display: flex; gap: 6px; }

    .preset {
      flex: 1;
      padding: 6px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .preset:hover { color: var(--text); border-color: var(--text-muted); }

    .msg {
      min-height: 0;
      margin: 0 0 12px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      display: none;
    }

    .msg.show { display: block; }
    .msg.error { background: var(--danger-dim); color: var(--danger); }
    .msg.ok { background: rgba(63, 185, 80, 0.12); color: var(--ok); }

    .incognito-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      padding: 8px 10px;
      border: 1px solid rgba(210, 153, 34, 0.5);
      border-radius: 8px;
      background: rgba(210, 153, 34, 0.12);
      color: var(--text);
      font-size: 12px;
      line-height: 1.4;
    }

    .incognito-banner[hidden] { display: none; }

    .incognito-banner .banner-text { flex: 1; min-width: 0; }

    .banner-btn {
      flex-shrink: 0;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-raised);
      color: var(--text);
      font-size: 11px;
      cursor: pointer;
    }

    .banner-btn:hover { border-color: var(--text-muted); }

    .banner-close {
      flex-shrink: 0;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 4px;
    }

    .banner-close:hover { color: var(--text); }

    .list { list-style: none; margin: 0; padding: 0; }

    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .item:last-child { border-bottom: none; }

    .item-info { flex: 1; min-width: 0; }

    .item-domain {
      font-size: 13px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-sub {
      font-size: 12px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      font-family: var(--mono);
      margin-top: 2px;
    }

    .item-suspended .item-domain { color: var(--text-muted); text-decoration: line-through; }

    .item-masked .item-domain {
      color: var(--text-muted);
      font-style: italic;
    }

    .icon-btn.masked { color: var(--text-muted); }
    .icon-btn.masked:hover { color: var(--text); }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .check input { accent-color: var(--focus); }

    .switch {
      position: relative;
      width: 36px;
      height: 20px;
      flex: none;
      border: none;
      border-radius: 999px;
      background: var(--border);
      cursor: pointer;
      transition: background 0.2s;
      padding: 0;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: transform 0.2s, background 0.2s;
    }

    .switch.on { background: var(--danger); }
    .switch.on::after { transform: translateX(16px); background: #fff; }

    .switch:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    .actions { display: flex; gap: 2px; flex: none; }

    .icon-btn {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .icon-btn:hover { background: var(--surface-raised); color: var(--text); }
    .icon-btn.danger:hover { color: var(--danger); }
    .icon-btn:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    .sort-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .sort-bar select {
      flex: 0 1 auto;
      width: auto;
      padding: 7px 28px 7px 10px;
      font-size: 12px;
    }

    .pager {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
    }

    .pager[hidden] { display: none; }

    .pager button {
      min-width: 28px;
      height: 28px;
      padding: 0 6px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .pager button:hover:not(:disabled) { color: var(--text); border-color: var(--text-muted); }
    .pager button:disabled { opacity: 0.4; cursor: default; }
    .pager button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    .pager .page-numbers {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .pager-ellipsis {
      color: var(--text-muted);
      font-size: 12px;
      padding: 0 2px;
    }

    .pager .page-numbers button.current {
      background: var(--surface-raised);
      color: var(--text);
    }

    .empty {
      padding: 26px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="dot" id="headerDot"></div>
    <h1>Scheduled URL Blocker &amp; Focus Site Blocker</h1>
    <span class="count" id="count"></span>
  </div>

  <div class="incognito-banner" id="incognitoBanner" hidden>
    <span class="banner-text">Private windows: not enabled. Enable it in extension settings.</span>
    <button type="button" class="banner-btn" id="enableIncognitoBtn">Enable</button>
    <button type="button" class="banner-close" id="incognitoDismiss" aria-label="Dismiss">&times;</button>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" id="tabAdd" role="tab" aria-selected="true">New block</button>
    <button class="tab" id="tabList" role="tab" aria-selected="false">List</button>
  </div>

  <div id="panelAdd" class="panel active" role="tabpanel">
    <form id="addForm" autocomplete="off">
      <div class="field">
        <label for="urlInput">Website address</label>
        <input type="text" id="urlInput" placeholder="e.g. facebook.com" spellcheck="false">
      </div>

      <div class="field">
        <label class="check">
          <input type="checkbox" id="maskToggle">
          <span>Hide site in list</span>
        </label>
      </div>

      <div class="field" id="maskLabelField" hidden>
        <label for="maskLabelInput">Display name</label>
        <input type="text" id="maskLabelInput" placeholder="e.g. Work" spellcheck="false">
      </div>

      <div class="field">
        <label>Schedule</label>
        <div class="modes" role="radiogroup">
          <button type="button" class="mode active" data-mode="all_day">All day</button>
          <button type="button" class="mode" data-mode="time_window">Time window</button>
        </div>
      </div>

      <div class="field" id="timeFields" hidden>
        <label for="startSelect">Block between</label>
        <div class="field-row">
          <select id="startSelect"></select>
          <span class="sep">→</span>
          <select id="endSelect"></select>
        </div>
        <div class="preset-row">
          <button type="button" class="preset" data-preset="10:00,16:00">10:00–16:00</button>
          <button type="button" class="preset" data-preset="09:00,17:00">09:00–17:00</button>
          <button type="button" class="preset" data-preset="22:00,06:00">22:00–06:00</button>
        </div>
      </div>

      <p class="msg" id="msg"></p>

      <button type="submit" class="prime" id="submitBtn">Block</button>
    </form>
  </div>

  <div id="panelList" class="panel" role="tabpanel">
    <div class="sort-bar">
      <select id="sortSelect" aria-label="Sort list">
        <option value="az">Name A–Z</option>
        <option value="za">Name Z–A</option>
        <option value="newest">Date added (new → old)</option>
        <option value="oldest">Date added (old → new)</option>
      </select>
    </div>
    <ul class="list" id="list"></ul>
    <nav class="pager" id="pager" hidden aria-label="Pagination">
      <button type="button" id="pagePrev" aria-label="Previous page">‹</button>
      <div class="page-numbers" id="pageNumbers"></div>
      <button type="button" id="pageNext" aria-label="Next page">›</button>
    </nav>
    <div class="empty" id="empty" hidden>No blocked sites.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
